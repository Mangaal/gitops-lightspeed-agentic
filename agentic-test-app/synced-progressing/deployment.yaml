apiVersion: v1
kind: Namespace
metadata:
  labels:
  #argocd app mamange by lebel
  argocd.argoproj.io/managed-by: openshift-gitops
  name: stuck-progressing-namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:  
  name: stuck-progressing
  namespace: stuck-progressing-namespace
  labels:
    app: stuck-progressing
  template:
    metadata:
      labels:
        app: stuck-progressing
    spec:
      containers:
        - name: nginx
          image: quay.io/nginx/nginx-unprivileged:1.27
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          # Container runs, but never becomes ready → Application stays Progressing.
          readinessProbe:
            httpGet:
              path: /never-ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
