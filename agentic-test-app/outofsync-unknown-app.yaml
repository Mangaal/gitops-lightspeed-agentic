apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: outofsync-unknown
  namespace: openshift-gitops
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: agentic-test-outofsync-unknown
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  source:
    repoURL: https://github.com/Mangaal/gitops-lightspeed-agentic.git
    targetRevision: main
    path: agentic-test-app/outofsync-unknown
